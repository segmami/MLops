<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmer diagnostic (medecin)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 20px; background: #f5f0f8; }
    .card { background: #fff; border-radius: 14px; padding: 26px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
    h2 { margin-top: 0; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: .9rem; }
    input, select { width: 100%; padding: 10px; border: 1px solid #cdd5df; border-radius: 8px; }
    input[readonly] { background: #f1f5f9; color: #475569; }
    button { margin-top: 16px; width: 100%; padding: 12px; background: #7c3aed; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    button.search { background: #2563eb; }
    #infos { display: none; margin-top: 18px; }
    #pred { margin-top: 14px; padding: 12px; border-radius: 10px; text-align: center; font-weight: 600; }
    #res { margin-top: 16px; padding: 14px; border-radius: 10px; text-align: center; display: none; font-weight: 600; }
    .ok { background: #dcfce7; color: #166534; } .no { background: #fee2e2; color: #991b1b; }
    .malade { background: #fee2e2; color: #991b1b; } .sain { background: #dcfce7; color: #166534; }
    .err { background: #fef3c7; color: #92400e; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Confirmer un diagnostic</h2>

    <label>Numero de suivi du patient (ID)</label>
    <input type="number" id="pid" placeholder="ex: 42">
    <button class="search" onclick="rechercher()">Rechercher</button>

    <div id="infos">
      <label>Age</label><input id="age" readonly>
      <label>Salaire</label><input id="salaire" readonly>
      <label>Conso produit X</label><input id="cx" readonly>
      <label>Conso produit Y</label><input id="cy" readonly>
      <label>Niveau de vie</label><input id="niveau_vie" readonly>

      <div id="pred"></div>

      <label>Vrai diagnostic (a verifier avec le patient)</label>
      <select id="malade"><option value="0">sain</option><option value="1">malade</option></select>
      <button onclick="confirmer()">Confirmer le diagnostic</button>
    </div>

    <div id="res"></div>
  </div>

  <script>
    const API_URL = "https://mlops-2285.onrender.com";   // ton URL API
    let predClasse = null;

    async function rechercher() {
      const id = document.getElementById("pid").value;
      const res = document.getElementById("res");
      res.style.display = "none";
      try {
        const rep = await fetch(API_URL + "/patient/" + id);
        const data = await rep.json();
        if (!data.trouve) {
          res.style.display = "block"; res.className = "err";
          res.textContent = "ID introuvable. Verifie le numero.";
          document.getElementById("infos").style.display = "none";
          return;
        }
        document.getElementById("age").value = data.age;
        document.getElementById("salaire").value = data.salaire;
        document.getElementById("cx").value = data.conso_produit_x;
        document.getElementById("cy").value = data.conso_produit_y;
        document.getElementById("niveau_vie").value = data.niveau_vie;

        predClasse = data.classe;
        const pred = document.getElementById("pred");
        pred.className = data.label === "malade" ? "malade" : "sain";
        pred.textContent = "Prediction du modele : " + data.label.toUpperCase()
                         + " (" + (data.proba_malade*100).toFixed(1) + " %)";

        document.getElementById("infos").style.display = "block";
      } catch (e) {
        res.style.display = "block"; res.className = "err";
        res.textContent = "Erreur : " + e.message;
      }
    }

    async function confirmer() {
      const id = document.getElementById("pid").value;
      const malade = +document.getElementById("malade").value;
      const res = document.getElementById("res");
      try {
        await fetch(API_URL + "/confirmer", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prediction_id: +id, malade: malade }),
        });
        res.style.display = "block";
        const correct = (predClasse === malade);
        res.className = correct ? "ok" : "no";
        res.innerHTML = correct
          ? "CORRECT : le modele avait raison"
          : "INCORRECT : le modele s'etait trompe";
      } catch (e) {
        res.style.display = "block"; res.className = "err";
        res.textContent = "Erreur : " + e.message;
      }
    }
  </script>
</body>
</html>
